name: VoiceForm App Service CI/CD

on:
  push:
    branches:
      - main

env:
  WEBAPP_NAME: app-voiceform-cac1
  PYTHON_VERSION: '3.11'
  APP_PATH: 'app-service/backend-app'

jobs:
# ─────────────────────────────────────────────────
# JOB 1: CI — Install dependencies and package
# Runs on every push to main.
# Stops everything if it fails.
# ─────────────────────────────────────────────────
  ci:
    name: CI — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.APP_PATH }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Zip artifact for deployment
        working-directory: ${{ env.APP_PATH }}
        run: zip -r ../../../release.zip . --exclude "*.pyc" --exclude "__pycache__/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceform-build
          path: release.zip
          retention-days: 1

# ─────────────────────────────────────────────────
# JOB 2: Deploy to Production
# Pipeline PAUSES here — yellow banner appears in GitHub.
# Click it → select production → click Approve.
# After approval — deploys directly to production.
# ─────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: production
      url: https://app-voiceform-cac1.azurewebsites.net

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: voiceform-build

      - name: Deploy to Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: release.zip